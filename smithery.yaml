startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      STD_REFS:
        type: string
        description: Path to the standards knowledge base directory (default: references/)
    required: []
  commandFunction: |-
    (config) => ({ command: 'python', args: ['standards_mcp_server.py'], env: config.STD_REFS ? { STD_REFS: config.STD_REFS } : {} })
name: medxpert-standards-connector
description: Medical-device standards retrieval MCP connector (read-only, 4 tools, zero credentials).
